services:
  arcanium-ui:
    image: arcanium-ui:local
    build:
      context: ../../arcanium/ui
      dockerfile: Containerfile
    container_name: arcanium-ui
    hostname: arcanium-ui
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NUXT_ARCANIUM_API_INTERNAL: "http://arcanium-api:3001"
      NODE_ENV: "production"
    networks:
      - arcanium-control
    depends_on:
      arcanium-api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  arcanium-api:
    image: arcanium-api:local
    build:
      context: ../../arcanium/api
      dockerfile: Containerfile
    container_name: arcanium-api
    hostname: arcanium-api
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      VAULT_ADDR: "https://vault-1:8200"
      VAULT_CACERT: "/vault/tls/ca-chain.pem"
      # Prompt 30 — VAULT_ROLE_ID/VAULT_SECRET_ID removed: this process no
      # longer logs in itself. arcanium-vault-agent (below) does, and
      # renders a token + DB credential into vault-agent-secrets, mounted
      # read-only here.
      # Prompt 14.2 — provisioner token for cross-namespace writes
      VAULT_PROVISIONER_TOKEN: "${VAULT_PROVISIONER_TOKEN:-}"
      # Prompt 18 — human auth via OIDC (default off)
      ARCANIUM_AUTH_ENABLED: "${ARCANIUM_AUTH_ENABLED:-false}"
      ARCANIUM_DEMO_PERSONA_SWITCH: "${ARCANIUM_DEMO_PERSONA_SWITCH:-false}"
      # Prompt 23 — interactive API explorer at /api-docs (default off; NODE_ENV=production is an additional hard block)
      ARCANIUM_API_EXPLORER_ENABLED: "${ARCANIUM_API_EXPLORER_ENABLED:-false}"
      ARCANIUM_API_EXPLORER_PUBLIC_URL: "${ARCANIUM_API_EXPLORER_PUBLIC_URL:-http://localhost:3050}"
      ARCANIUM_OIDC_ISSUER: "${ARCANIUM_OIDC_ISSUER:-}"
      ARCANIUM_OIDC_INTERNAL_URL: "${ARCANIUM_OIDC_INTERNAL_URL:-}"
      ARCANIUM_OIDC_PUBLIC_URL: "${ARCANIUM_OIDC_PUBLIC_URL:-}"
      ARCANIUM_OIDC_CLIENT_ID: "${ARCANIUM_OIDC_CLIENT_ID:-arcanium-api}"
      ARCANIUM_OIDC_CLIENT_SECRET: "${ARCANIUM_OIDC_CLIENT_SECRET:-}"
      ARCANIUM_API_CALLBACK_URL: "${ARCANIUM_API_CALLBACK_URL:-}"
      ARCANIUM_BASE_URL: "${ARCANIUM_BASE_URL:-http://localhost:3000}"
      # Prompt 15.6 — sync (run in request) | queue (arcanium-worker drains)
      PROVISION_MODE: "${PROVISION_MODE:-sync}"
      # Prompt 14.1 — read-only peek at vault-hsm to surface Managed Key custody
      VAULT_HSM_ADDR: "${VAULT_HSM_ADDR:-https://vault-hsm:8200}"
      ARCANIUM_HSM_ROLE_ID: "${ARCANIUM_HSM_ROLE_ID:-}"
      ARCANIUM_HSM_SECRET_ID: "${ARCANIUM_HSM_SECRET_ID:-}"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB}"
      # Hardcoded, not parameterized: this is the /api-docs hard safety net
      # (index.js, Prompt 23) — it must not be overridable by a stray
      # NODE_ENV in the operator's shell/.env. arcanium-api-dev below is the
      # only service allowed to run non-production.
      NODE_ENV: "production"
      PORT: "3001"
    volumes:
      - ../../vault-tls:/vault/tls:ro
      - vault-agent-secrets:/vault/secrets:ro
    networks:
      - arcanium-control
      - arcanium-vault-internal
    restart: unless-stopped
    depends_on:
      arcanium-vault-agent:
        condition: service_healthy
    # Prompt 29 — /health/live always returns 200 (process-up only) and
    # never noticed a live incident where the DB credential rotation loop
    # died silently and every authenticated request failed for 13+ minutes
    # while podman kept reporting this container healthy. /health/ready
    # actually pings the database with the current pool and returns 503 on
    # failure — the correct probe here.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Prompt 23 — API explorer (Scalar). Mirrors arcanium-api exactly except:
  #   NODE_ENV=development (unlocks the /api-docs gate in index.js)
  #   ARCANIUM_API_EXPLORER_ENABLED=true (the explicit opt-in flag)
  # Not started by default — bring up with: make arcanium-api-dev-up
  # Access: http://localhost:3050/api-docs (requires an active arc_session cookie)
  arcanium-api-dev:
    image: arcanium-api:local
    build:
      context: ../../arcanium/api
      dockerfile: Containerfile
    container_name: arcanium-api-dev
    hostname: arcanium-api-dev
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:3050:3001"
    environment:
      VAULT_ADDR: "https://vault-1:8200"
      VAULT_CACERT: "/vault/tls/ca-chain.pem"
      # Prompt 30 — same as arcanium-api: no longer logs in itself, reads
      # the shared Agent-rendered token/DB credential (same identity,
      # same shared volume — this is the same image/code, just a dev-mode
      # invocation, so it needed the same fix or it would simply not start).
      VAULT_PROVISIONER_TOKEN: "${VAULT_PROVISIONER_TOKEN:-}"
      ARCANIUM_AUTH_ENABLED: "${ARCANIUM_AUTH_ENABLED:-false}"
      ARCANIUM_DEMO_PERSONA_SWITCH: "${ARCANIUM_DEMO_PERSONA_SWITCH:-false}"
      ARCANIUM_API_EXPLORER_ENABLED: "true"
      ARCANIUM_OIDC_ISSUER: "${ARCANIUM_OIDC_ISSUER:-}"
      ARCANIUM_OIDC_INTERNAL_URL: "${ARCANIUM_OIDC_INTERNAL_URL:-}"
      ARCANIUM_OIDC_PUBLIC_URL: "${ARCANIUM_OIDC_PUBLIC_URL:-}"
      ARCANIUM_OIDC_CLIENT_ID: "${ARCANIUM_OIDC_CLIENT_ID:-arcanium-api}"
      ARCANIUM_OIDC_CLIENT_SECRET: "${ARCANIUM_OIDC_CLIENT_SECRET:-}"
      ARCANIUM_API_CALLBACK_URL: "${ARCANIUM_API_CALLBACK_URL:-}"
      ARCANIUM_BASE_URL: "${ARCANIUM_BASE_URL:-http://localhost:3000}"
      PROVISION_MODE: "${PROVISION_MODE:-sync}"
      VAULT_HSM_ADDR: "${VAULT_HSM_ADDR:-https://vault-hsm:8200}"
      ARCANIUM_HSM_ROLE_ID: "${ARCANIUM_HSM_ROLE_ID:-}"
      ARCANIUM_HSM_SECRET_ID: "${ARCANIUM_HSM_SECRET_ID:-}"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB}"
      NODE_ENV: "development"
      PORT: "3001"
    volumes:
      - ../../vault-tls:/vault/tls:ro
      - vault-agent-secrets:/vault/secrets:ro
    networks:
      - arcanium-control
      - arcanium-vault-internal
    depends_on:
      arcanium-vault-agent:
        condition: service_healthy
    # Prompt 29 — /health/live always returns 200 (process-up only) and
    # never noticed a live incident where the DB credential rotation loop
    # died silently and every authenticated request failed for 13+ minutes
    # while podman kept reporting this container healthy. /health/ready
    # actually pings the database with the current pool and returns 503 on
    # failure — the correct probe here.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Prompt 15.6 — drains provisioning_jobs when PROVISION_MODE=queue.
  # Harmless (idle) in the default sync mode.
  arcanium-worker:
    image: arcanium-api:local
    build:
      context: ../../arcanium/api
      dockerfile: Containerfile
    container_name: arcanium-worker
    hostname: arcanium-worker
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    command: ["node", "src/worker.js"]
    environment:
      VAULT_ADDR: "https://vault-1:8200"
      VAULT_CACERT: "/vault/tls/ca-chain.pem"
      # Prompt 30 — see arcanium-api's own comment above: this process no
      # longer logs in itself either; it reads the same Agent-rendered
      # token + DB credential from the shared, read-only secrets volume.
      VAULT_PROVISIONER_TOKEN: "${VAULT_PROVISIONER_TOKEN:-}"
      VAULT_HSM_ADDR: "${VAULT_HSM_ADDR:-https://vault-hsm:8200}"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_DB: "${POSTGRES_DB}"
      NODE_ENV: "production"
      # Prompt 15.3 — ingest Vault audit evidence into the trail (default off).
      # Reads the world-readable audit device (file2, mode 0644) — see docs/evidence-model.md.
      EVIDENCE_INGEST_ENABLED: "${EVIDENCE_INGEST_ENABLED:-false}"
      AUDIT_LOG_PATH: "${AUDIT_LOG_PATH:-/vault/audit/vault-audit-r.log}"
      # Prompt 15.5 — the emulated KMS (compose/kms-sim, LocalStack). Used only to
      # probe reachability so the keys page can show "unreachable" honestly.
      KMS_SIM_URL: "${KMS_SIM_URL:-http://arcanium-localstack:4566}"
    volumes:
      - ../../vault-tls:/vault/tls:ro
      - vault-1-audit:/vault/audit:ro
      - vault-agent-secrets:/vault/secrets:ro
    networks:
      - arcanium-control
      - arcanium-vault-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'node src/worker.js' >/dev/null || exit 1"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 20s
    depends_on:
      arcanium-api:
        condition: service_healthy
      arcanium-vault-agent:
        condition: service_healthy

  # Prompt 30 — owns AppRole auto-auth + dynamic DB-credential rendering
  # for the arcanium-api identity, replacing vault.js's own hand-rolled
  # login()/rotation retry loops (Prompt 29 hardened those; this prompt
  # removes the need for this project to own that problem at all). Proven
  # standalone (real token + real DB creds rendered and verified) before
  # arcanium-api/arcanium-worker were ever pointed at it — see this
  # prompt's own Design rules.
  arcanium-vault-agent:
    image: docker.io/hashicorp/vault-enterprise:2.1.0-ent
    container_name: arcanium-vault-agent
    hostname: arcanium-vault-agent
    # Prompt 30 — NOT "100:1000" (the vault-1/2/3/vault-s convention):
    # this agent's rendered token file needs to be read cross-container by
    # arcanium-api/worker, which run as 1000:1000. The sink stanza's own
    # `mode` config did not reliably grant group-read (see config.hcl's
    # own comment) — matching the UID directly sidesteps that entirely,
    # since the file's default owner-only 0600 then already covers it.
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp, /home/vault]
    entrypoint: ["/vault/agent/entrypoint.sh"]
    environment:
      VAULT_ADDR: "https://vault-1:8200"
      VAULT_CACERT: "/vault/tls/ca-chain.pem"
      ARCANIUM_VAULT_ROLE_ID: "${ARCANIUM_VAULT_ROLE_ID}"
      ARCANIUM_VAULT_SECRET_ID: "${ARCANIUM_VAULT_SECRET_ID}"
    volumes:
      - ../../vault-tls:/vault/tls:ro
      - ./vault-agent/config.hcl:/vault/agent/config.hcl:ro
      - ./vault-agent/entrypoint.sh:/vault/agent/entrypoint.sh:ro
      - vault-agent-secrets:/vault/secrets
    networks:
      - arcanium-vault-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -s /vault/secrets/token && test -s /vault/secrets/db-creds.json"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

networks:
  arcanium-control:
    name: arcanium-control
    external: true
  arcanium-vault-internal:
    name: arcanium-vault-internal
    external: true

volumes:
  # Owned by the vault compose project — mounted read-only for evidence ingestion.
  vault-1-audit:
    name: arcanium-vault_vault-1-audit
    external: true
  # Prompt 30 — owned by THIS compose project (not external): shared
  # between arcanium-vault-agent (writer) and arcanium-api/arcanium-worker
  # (read-only consumers, Deliverable 3).
  vault-agent-secrets: {}
