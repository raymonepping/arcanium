# Adapted from vault_reference/docker-compose.yml; only the primary cluster.
x-vault: &vault
  image: docker.io/hashicorp/vault-enterprise:2.1.0-ent
  user: "100:1000"
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  environment:
    VAULT_ADDR: https://127.0.0.1:8200
    VAULT_CACERT: /vault/config/tls/ca-chain.pem
    VAULT_LICENSE: "${VAULT_LICENSE}"
  entrypoint: ["/bin/sh", "/arcanium/vault-server.sh"]
  restart: unless-stopped
  mem_limit: 2g
  networks: [default]
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://127.0.0.1:8200/v1/sys/health?standbyok=true&sealedok=true&uninitok=false >/dev/null"]
    interval: 10s
    timeout: 5s
    retries: 15
    start_period: 20s

services:
  vault-s:
    <<: *vault
    container_name: arcanium-vault_s
    hostname: vault-s
    ports: ["127.0.0.1:18190:8200"]
    volumes:
      - vault-s-data:/vault/file
      - vault-s-audit:/vault/audit
      - ../../vault-s/config-s.hcl:/vault/config/config.hcl:ro
      - ../../vault-s/config/vault_v2.hclic:/vault/config/vault_v2.hclic:ro
      - ../../vault-tls:/vault/config/tls:ro
      - ../../scripts/vault-server.sh:/arcanium/vault-server.sh:ro

  vault-1:
    <<: *vault
    container_name: arcanium-vault_1
    hostname: vault-1
    ports:
      - "127.0.0.1:18200:8200"
      - "127.0.0.1:15696:5696"
    volumes:
      - vault-1-data:/vault/file
      - vault-1-audit:/vault/audit
      - ../../vault-1/config.hcl:/vault/config/config.hcl:ro
      - ../../vault-s/config/vault_v2.hclic:/vault/config/vault_v2.hclic:ro
      - ../../vault-tls:/vault/config/tls:ro
      - ../../scripts/vault-server.sh:/arcanium/vault-server.sh:ro
      - ../../.secrets/vault/transit-token:/run/secrets/transit-token:ro
    depends_on:
      vault-s:
        condition: service_healthy

  vault-2:
    <<: *vault
    container_name: arcanium-vault_2
    hostname: vault-2
    ports: ["127.0.0.1:18201:8200"]
    volumes:
      - vault-2-data:/vault/file
      - vault-2-audit:/vault/audit
      - ../../vault-2/config-2.hcl:/vault/config/config.hcl:ro
      - ../../vault-s/config/vault_v2.hclic:/vault/config/vault_v2.hclic:ro
      - ../../vault-tls:/vault/config/tls:ro
      - ../../scripts/vault-server.sh:/arcanium/vault-server.sh:ro
      - ../../.secrets/vault/transit-token:/run/secrets/transit-token:ro
    depends_on:
      vault-s:
        condition: service_healthy

  vault-3:
    <<: *vault
    container_name: arcanium-vault_3
    hostname: vault-3
    ports: ["127.0.0.1:18202:8200"]
    volumes:
      - vault-3-data:/vault/file
      - vault-3-audit:/vault/audit
      - ../../vault-3/config-3.hcl:/vault/config/config.hcl:ro
      - ../../vault-s/config/vault_v2.hclic:/vault/config/vault_v2.hclic:ro
      - ../../vault-tls:/vault/config/tls:ro
      - ../../scripts/vault-server.sh:/arcanium/vault-server.sh:ro
      - ../../.secrets/vault/transit-token:/run/secrets/transit-token:ro
    depends_on:
      vault-s:
        condition: service_healthy

  # Prompt 30 — owns AppRole auto-auth + dynamic DB-credential rendering
  # for the arcanium-api identity, replacing vault.js's own hand-rolled
  # login()/rotation retry loops. Proven standalone (real token + real DB
  # creds rendered and verified) before arcanium-api/arcanium-worker were
  # ever pointed at it — see Prompt 30's own Design rules.
  # Prompt 45 — moved here from compose/arcanium/compose.yaml: this is
  # Vault auto-auth, not an arcanium-application concern. arcanium-api/
  # arcanium-worker/arcanium-api-dev (compose/arcanium/compose.yaml) still
  # consume its output via the vault-agent-secrets volume below, now
  # referenced there as external — see that file's own comment. Startup
  # timing is unchanged from before the move: scripts/rehydrate-stack.sh
  # still starts this at the exact same point in the sequence (still
  # ahead of workload-credentials.sh issuing a fresh ARCANIUM_VAULT_
  # ROLE_ID/SECRET_ID — this container bakes those into its environment
  # at start time, it does not re-read .env live, so starting it earlier
  # against a stale/empty pair would be a real regression, not cosmetic).
  arcanium-vault-agent:
    image: docker.io/hashicorp/vault-enterprise:2.1.0-ent
    container_name: arcanium-vault_agent
    hostname: arcanium-vault-agent
    # Prompt 30 — NOT "100:1000" (the vault-1/2/3/vault-s convention):
    # this agent's rendered token file needs to be read cross-container by
    # arcanium-api/worker, which run as 1000:1000. The sink stanza's own
    # `mode` config did not reliably grant group-read (see config.hcl's
    # own comment) — matching the UID directly sidesteps that entirely,
    # since the file's default owner-only 0600 then already covers it.
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp, /home/vault]
    entrypoint: ["/vault/agent/entrypoint.sh"]
    environment:
      VAULT_ADDR: "https://vault-1:8200"
      VAULT_CACERT: "/vault/tls/ca-chain.pem"
      ARCANIUM_VAULT_ROLE_ID: "${ARCANIUM_VAULT_ROLE_ID}"
      ARCANIUM_VAULT_SECRET_ID: "${ARCANIUM_VAULT_SECRET_ID}"
    volumes:
      - ../../vault-tls:/vault/tls:ro
      - ./vault-agent/config.hcl:/vault/agent/config.hcl:ro
      - ./vault-agent/entrypoint.sh:/vault/agent/entrypoint.sh:ro
      - vault-agent-secrets:/vault/secrets
    networks: [default]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -s /vault/secrets/token && test -s /vault/secrets/db-creds.json"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

networks:
  default:
    name: arcanium-vault-internal
    external: true

volumes:
  vault-s-data: {}
  vault-s-audit: {}
  vault-1-data: {}
  vault-1-audit: {}
  vault-2-data: {}
  vault-2-audit: {}
  vault-3-data: {}
  vault-3-audit: {}
  # Prompt 45 — moved here from compose/arcanium/compose.yaml (owned by
  # THIS compose project now). arcanium-api/worker/api-dev reference this
  # exact volume as external — see that file's own comment for the naming
  # convention (matches vault-1-audit's existing external reference).
  vault-agent-secrets: {}
