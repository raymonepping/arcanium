# Vale configuration — see docs/writing/config/QUALITY.md for the durable
# gate policy this feeds, and docs/writing/DOCS_TOOLCHAIN_REPORT.md for
# why these specific styles/rules were chosen (not the full Style Hub).
StylesPath = docs/writing/config/styles
MinAlertLevel = suggestion
Vocab = Arcanium
Packages = write-good, alex

[*.md]
BasedOnStyles = Vale, write-good, alex

# E-Prime bans every form of "to be" (is/are/was/were) outright — a
# whole linguistic discipline, not a prose-quality signal, and far too
# strict for this project's own precise, technical register (it fired on
# nearly every sentence in the existing corpus during evaluation, none of
# them genuine AI-writing tells). Disabled deliberately, not silently.
write-good.E-Prime = NO

# Flagged ordinary technical words ("remains", etc.) as "profane in some
# cases" — a real false-positive-prone rule for this corpus's register,
# confirmed live during evaluation, not assumed. Disabled deliberately.
alex.ProfanityUnlikely = NO

# "disabled"/"special" almost always describe a feature/config STATE in
# this corpus (ARCANIUM_AUTH_ENABLED, a disabled toggle, "special-purpose
# skills") — never a person. Confirmed live: 9/9 occurrences across the
# corpus were this false-positive class, 0 were about a person. Disabled
# deliberately; alex.Condescending stays on, since its findings ("simply")
# are a real, worth-reviewing pattern, not a corpus-wide false positive.
alex.Ablist = NO
