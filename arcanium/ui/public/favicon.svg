  <!-- key shank -->
  <line x1="16" y1="18.5" x2="16" y2="23" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="14.5" y1="21" x2="16" y2="21" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="14.5" y1="23" x2="16" y2="23" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round"/>
</svg>
