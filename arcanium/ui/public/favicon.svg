<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="6" fill="#0f1a2a"/>
  <!-- outer ring -->
  <circle cx="16" cy="16" r="11" stroke="#7dd3fc" stroke-width="1.5" fill="none"/>
  <!-- inner hexagon -->
  <polygon points="16,7 22.5,11 22.5,19 16,23 9.5,19 9.5,11" stroke="#38bdf8" stroke-width="1.2" fill="none"/>
  <!-- centre key dot -->
